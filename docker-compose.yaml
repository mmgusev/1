
services:
  postgres:
    build:
      dockerfile: ./postgres-init/Dockerfile
    container_name: postgres_app_db
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: secure_password_123
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-sql:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app_user"]
      interval: 5s
      timeout: 3s
      retries: 20

  vault:
    image: hashicorp/vault:latest
    container_name: vault_dev
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
      SKIP_SETCAP: "true"
    ports:
      - "8200:8200"
    volumes:
      - vault-file:/vault/file
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  vault-setup:
    image: hashicorp/vault:latest
    container_name: vault_setup
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
    volumes:
      - ./vault-init:/vault-init:ro
      - vault-file:/vault/file
    command: sh /vault-init/setup.sh
    restart: "no"

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: postgres_pinger
    depends_on:
      postgres:
        condition: service_healthy
      vault-setup:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_SECRET_PATH: secret/database
    volumes:
      - ./app/logs:/app/logs
      - vault-file:/vault/file:ro
    restart: unless-stopped

volumes:
  pgdata:
  vault-file:
