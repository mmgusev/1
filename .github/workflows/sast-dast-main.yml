name: "SAST + DAST — Main Branch"

# Триггер: Push/Merge в ветку main
on:
  push:
    branches:
      - "main"

jobs:
  # ── Job 1: SAST ────────────────────────────────────────────────────────────
  sast:
    name: "SAST (Bandit + Semgrep)"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SAST tools
        run: pip install bandit semgrep

      - name: Create reports directory
        run: mkdir -p task10

      - name: Run Bandit
        run: |
          bandit -r task7/app/ -f json -o task10/main_bandit_report.json --exit-zero
          bandit -r task7/app/ -f txt  -o task10/main_bandit_report.txt  --exit-zero
        continue-on-error: true

      - name: Print Bandit summary
        run: cat task10/main_bandit_report.txt || true

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config auto \
            --json \
            --output task10/main_semgrep_report.json \
            task7/app/ task7/app/templates/ \
            --no-error
        continue-on-error: true

      - name: Print Semgrep summary
        run: |
          python3 -c "
          import json
          with open('task10/main_semgrep_report.json') as f:
              d = json.load(f)
          results = d.get('results', [])
          print(f'Semgrep findings: {len(results)}')
          for r in results:
              sev = r.get('extra', {}).get('severity', '?')
              print(f'  [{sev}] {r[\"check_id\"]} @ {r[\"path\"]}:{r[\"start\"][\"line\"]}')
          " || true

      - name: Upload SAST artifacts
        uses: actions/upload-artifact@v4
        with:
          name: main-sast-reports-${{ github.sha }}
          path: |
            task10/main_bandit_report.json
            task10/main_bandit_report.txt
            task10/main_semgrep_report.json
          retention-days: 30

  # ── Job 2: DAST ────────────────────────────────────────────────────────────
  dast:
    name: "DAST (OWASP ZAP)"
    runs-on: ubuntu-latest
    needs: sast
    permissions:
      contents: read

    services:
      db:
        image: postgres:15
        env:
          POSTGRES_DB: shop_demo
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shop_demo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r task7/requirements.txt

      - name: Initialize database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d shop_demo -f task7/schema.sql
          psql -h localhost -U postgres -d shop_demo -f task7/create_user_and_grants.sql
          psql -h localhost -U postgres -d shop_demo -f task7/demo_data.sql

      - name: Start Flask application
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: shop_demo
          DB_USER: app_user
          DB_PASS: "app_pass_ChangeMe!"
          SECRET_KEY: "ci-cd-main-secret-key"
          DUPLICATE_LOG_FILE: "/tmp/shop_app.log"
        run: |
          cd task7
          python app/web.py &
          echo "Flask PID=$!"
          for i in $(seq 1 20); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/ | grep -q "200"; then
              echo "Flask is up after ${i}s"
              break
            fi
            echo "Waiting for Flask... ($i/20)"
            sleep 3
          done
          curl -v http://localhost:5000/ 2>&1 | head -20

      - name: Create reports directory
        run: mkdir -p task10

      # ── ZAP Black-box ──────────────────────────────────────────────────────
      - name: ZAP Black-box Baseline Scan
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/task10":/zap/wrk:rw \
            zaproxy/zap-stable \
            zap-baseline.py \
            -t http://localhost:5000 \
            -J main_blackbox_report.json \
            -r main_blackbox_report.html \
            -l PASS \
            --auto || true
        continue-on-error: true

      # ── ZAP Grey-box ───────────────────────────────────────────────────────
      - name: Prepare ZAP grey-box plan
        run: |
          cat > /tmp/zap_greybox_main.yaml << 'ZAPEOF'
          ---
          env:
            contexts:
              - name: "shop_demo_greybox_main"
                urls:
                  - "http://localhost:5000"
                includePaths:
                  - "http://localhost:5000.*"
                excludePaths:
                  - "http://localhost:5000/logout"
                authentication:
                  method: "form"
                  parameters:
                    loginPageUrl: "http://localhost:5000/"
                    loginRequestData: "db_user={%username%}&db_pass={%password%}"
                    loginUrl: "http://localhost:5000/"
                  verification:
                    method: "response"
                    loggedInRegex: "\\QWelcome,\\E"
                    loggedOutRegex: "\\QPlease log in\\E"
                sessionManagement:
                  method: "cookie"
                users:
                  - name: "app_user"
                    credentials:
                      username: "app_user"
                      password: "app_pass_ChangeMe!"
            parameters:
              failOnError: false
              failOnWarning: false
              progressToStdout: true
          jobs:
            - type: requestor
              parameters:
                user: "app_user"
              requests:
                - url: "http://localhost:5000/"
                  method: "GET"
                - url: "http://localhost:5000/main"
                  method: "GET"
                - url: "http://localhost:5000/view?table=products"
                  method: "GET"
                - url: "http://localhost:5000/view?table=customers"
                  method: "GET"
                - url: "http://localhost:5000/view?table=orders"
                  method: "GET"
                - url: "http://localhost:5000/add?table=products"
                  method: "GET"
                - url: "http://localhost:5000/update?table=products"
                  method: "GET"
                - url: "http://localhost:5000/update?table=products&id=1"
                  method: "GET"
            - type: spider
              parameters:
                context: "shop_demo_greybox_main"
                user: "app_user"
                url: "http://localhost:5000"
                maxDuration: 2
                maxDepth: 10
            - type: passiveScan-wait
              parameters:
                maxDuration: 3
            - type: activeScan
              parameters:
                context: "shop_demo_greybox_main"
                user: "app_user"
                policy: "Default Policy"
                maxRuleDurationInMins: 2
                maxScanDurationInMins: 10
            - type: report
              parameters:
                template: "traditional-json"
                reportDir: "/zap/wrk"
                reportFile: "main_greybox_report"
                reportTitle: "ZAP Grey-box CI/CD main — shop_demo"
            - type: report
              parameters:
                template: "traditional-html"
                reportDir: "/zap/wrk"
                reportFile: "main_greybox_report"
                reportTitle: "ZAP Grey-box CI/CD main — shop_demo"
          ZAPEOF

      - name: ZAP Grey-box Scan
        run: |
          docker run --rm \
            --network host \
            -v /tmp:/zap/wrk:rw \
            zaproxy/zap-stable \
            zap.sh -cmd -autorun /zap/wrk/zap_greybox_main.yaml \
            > task10/main_greybox_run.log 2>&1 || true
          cp /tmp/main_greybox_report.json task10/ 2>/dev/null || true
          cp /tmp/main_greybox_report.html task10/ 2>/dev/null || true
          echo "=== Last 20 lines of grey-box log ==="
          tail -20 task10/main_greybox_run.log || true
        continue-on-error: true

      - name: List generated reports
        run: ls -lh task10/ || true

      - name: Upload DAST artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-dast-reports-${{ github.sha }}
          path: |
            task10/main_blackbox_report.json
            task10/main_blackbox_report.html
            task10/main_greybox_report.json
            task10/main_greybox_report.html
            task10/main_greybox_run.log
          retention-days: 30
