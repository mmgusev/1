{% extends "base.html" %}
{% block title %}Login – Shop DB{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-sm-10 col-md-6 col-lg-4">
    <div class="card shadow">
      <div class="card-header bg-dark text-white text-center">
        <h4 class="mb-0">🛒 Shop DB — Login</h4>
      </div>
      <div class="card-body">
        <form method="post" action="{{ url_for('login') }}" novalidate>
          <div class="mb-3">
            <label for="db_user" class="form-label fw-semibold">Database user</label>
            <input type="text" class="form-control" id="db_user" name="db_user"
                   placeholder="e.g. app_user" required autofocus
                   value="{{ request.form.get('db_user', '') }}"/>
          </div>
          <div class="mb-3">
            <label for="db_pass" class="form-label fw-semibold">Password</label>
            <input type="password" class="form-control" id="db_pass" name="db_pass"
                   placeholder="••••••••" required/>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-dark btn-lg">Sign in</button>
          </div>
        </form>
      </div>
      <div class="card-footer text-muted text-center small">
        Credentials are used only to connect to PostgreSQL.
      </div>
    </div>
  </div>
</div>
{% endblock %}
