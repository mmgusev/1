<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{% block title %}Shop DB{% endblock %}</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"/>
  <style>
    body { background: #f8f9fa; }
    .navbar-brand { font-weight: 700; letter-spacing: .05em; }
    .table-responsive { max-height: 70vh; overflow-y: auto; }
    thead th { position: sticky; top: 0; background: #fff; z-index: 1; }
  </style>
</head>
<body>
{% if session.db_user %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('index') }}">🛒 Shop DB</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'view' %}active{% endif %}"
             href="{{ url_for('view') }}">📋 View Tables</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'add' %}active{% endif %}"
             href="{{ url_for('add') }}">➕ Add Row</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'update' %}active{% endif %}"
             href="{{ url_for('update') }}">✏️ Update Row</a>
        </li>
      </ul>
      <span class="navbar-text me-3 text-light">
        👤 {{ session.db_user }}
      </span>
      <a class="btn btn-outline-light btn-sm" href="{{ url_for('logout') }}">Logout</a>
    </div>
  </div>
</nav>
{% endif %}

<div class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} alert-dismissible fade show" role="alert">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmFXFMrWQ8I5kfvxwsLMvyEjVlDa"
        crossorigin="anonymous"></script>
</body>
</html>
